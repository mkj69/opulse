<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Opulse">
  <title>Opulse — a glass cube of atoms with axes for composition, branching and recursion</title>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0fbff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4c1d95" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- halo -->
  <ellipse cx="128" cy="136" rx="92" ry="92" fill="#6366f1" opacity="0.18" filter="url(#soft)"/>

  <!-- cube: centre (128,128), edge 64 (isometric) -->
  <g stroke="#e0f2fe" stroke-linejoin="round">
    <path d="M128 64 L183.4 96 L128 128 L72.6 96 Z" fill="url(#top)" stroke-width="2.2" stroke-opacity="0.9"/>
    <path d="M72.6 96 L128 128 L128 192 L72.6 160 Z" fill="url(#left)" stroke-width="2.2" stroke-opacity="0.75"/>
    <path d="M183.4 96 L128 128 L128 192 L183.4 160 Z" fill="url(#right)" stroke-width="2.2" stroke-opacity="0.75"/>
  </g>
  <!-- cubelet grid (3 x 3 on each face) -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1">
    <path d="M146.5 74.7 L91.1 106.7 M164.9 85.3 L109.5 117.3"/>
    <path d="M109.5 74.7 L164.9 106.7 M91.1 85.3 L146.5 117.3"/>
    <path d="M91.1 106.7 L91.1 170.7 M109.5 117.3 L109.5 181.3"/>
    <path d="M72.6 117.3 L128 149.3 M72.6 138.7 L128 170.7"/>
    <path d="M164.9 106.7 L164.9 170.7 M146.5 117.3 L146.5 181.3"/>
    <path d="M183.4 117.3 L128 149.3 M183.4 138.7 L128 170.7"/>
  </g>
  <!-- glass highlight -->
  <path d="M128 68 L176 96 L128 92 L82 96 Z" fill="url(#shine)" opacity="0.45"/>

  <!-- axis 1: composition (up), layers as nodes -->
  <g filter="url(#glow)" stroke="#22d3ee" fill="#22d3ee" stroke-linecap="round">
    <path d="M128 128 L128 22" stroke-width="4"/>
    <circle cx="128" cy="96" r="4.5"/>
    <circle cx="128" cy="62" r="5.5"/>
    <circle cx="128" cy="24" r="7"/>
  </g>
  <!-- axis 2: branching (lower left), forks in two -->
  <g filter="url(#glow)" stroke="#fbbf24" fill="#fbbf24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 128 L64 165" stroke-width="4" fill="none"/>
    <path d="M64 165 L26 160 M64 165 L42 199" stroke-width="3.5" fill="none"/>
    <circle cx="64" cy="165" r="5"/>
    <circle cx="26" cy="160" r="6"/>
    <circle cx="42" cy="199" r="6"/>
  </g>
  <!-- axis 3: recursion (lower right), loops back on itself -->
  <g filter="url(#glow)" stroke="#e879f9" fill="none" stroke-linecap="round">
    <path d="M128 128 L190 164" stroke-width="4"/>
    <path d="M190 164 C214 178 236 168 232 148 C228 128 202 130 204 152 C206 170 226 176 238 170" stroke-width="3.5"/>
    <path d="M233 164 L240 169 L232 175" stroke-width="3" fill="none"/>
  </g>

  <!-- core: the atoms -->
  <circle cx="128" cy="128" r="16" fill="url(#core)"/>
  <circle cx="128" cy="128" r="5" fill="#ffffff"/>
</svg>
